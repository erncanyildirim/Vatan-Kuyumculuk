name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shared tests (JVM)
        run: ./gradlew :shared:testAndroidHostTest --console=plain
      - name: Android debug build
        run: ./gradlew :androidApp:assembleDebug --console=plain
      - name: Cloudflare function tests
        working-directory: cloudflare
        run: npm ci && npm test
      - name: Store listing lengths
        run: python3 tools/store/check_lengths.py
      - name: Site config is valid JSON
        run: python3 -m json.tool site/api/config > /dev/null
